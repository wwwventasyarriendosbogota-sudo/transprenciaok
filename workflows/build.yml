name: Build WindowTransparency for macOS Sierra

on:
  workflow_dispatch:

jobs:
  build:
    # The exact macOS 10.12 runner is no longer provided by GitHub.
    # We compile with a modern runner while explicitly targeting 10.12.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: |
          set -e
          rm -rf build WindowTransparency.app
          mkdir -p "WindowTransparency.app/Contents/MacOS"

          clang -fobjc-arc \
            -framework Cocoa \
            -framework ApplicationServices \
            -mmacosx-version-min=10.12 \
            Sources/main.m \
            -o "WindowTransparency.app/Contents/MacOS/WindowTransparency"

          cp Info.plist "WindowTransparency.app/Contents/Info.plist"

          codesign --force --deep --sign - "WindowTransparency.app"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "WindowTransparency.app" \
            "WindowTransparency-macOS-Sierra.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: WindowTransparency-macOS-Sierra
          path: WindowTransparency-macOS-Sierra.zip
